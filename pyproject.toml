[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-energy-lab"
version = "0.3.0"
description = "Pre-feasibility techno-economic screening engine for industrial energy decarbonization."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marcos Beltran" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
]
app = [
  "streamlit==1.62.0",
  "plotly>=6.5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
