name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Validate reproducible datasets
        run: |
          cp -a data/demo /tmp/demo-before
          cp -a data/metadata /tmp/metadata-before
          python scripts/generate_demo_data.py
          diff -ru /tmp/demo-before data/demo
          diff -ru /tmp/metadata-before data/metadata
      - name: Test
        run: pytest
