name: Deploy portfolio fallback

on:
  push:
    branches: ["main"]
    paths:
      - "portfolio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether GitHub Pages is enabled
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
              core.notice('GitHub Pages is enabled; deploying the static OptiDecarb fallback.');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.notice('GitHub Pages is not enabled yet. Enable Settings → Pages → Source: GitHub Actions once; future portfolio changes will deploy automatically.');
              } else {
                throw error;
              }
            }

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static portfolio
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Explain pending one-time enablement
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo '### Portfolio fallback not deployed yet' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Pages must be enabled once in **Settings → Pages → Source: GitHub Actions**.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No application or model change is required. After enablement, re-run this workflow or change `portfolio/**`.' >> "$GITHUB_STEP_SUMMARY"
